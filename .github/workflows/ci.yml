name: CI

# Fork-owned CI for self-hosted [self-hosted, linux, x64] runners.
#
# The runner host is orchestration only: it needs Git and Docker, never Node,
# pnpm or Rust. Every repository-controlled command runs inside the toolchain
# image from .github/ci.Dockerfile through .github/scripts/ci-run.sh, which
# also reproduces any lane locally:
#
#   .github/scripts/ci-run.sh -- pnpm run typecheck:build-gaps
#
# This replaces the upstream pr.yml -> pr-trusted.yml path, which routes to an
# AWS RunsOn fleet keyed to the upstream repository ID and falls back to
# GitHub-hosted runners elsewhere. Disable pr.yml in the repository's Actions
# settings so pull requests do not run both. The lanes below mirror what
# pr-trusted.yml verifies, regrouped for a small pool of persistent runners
# instead of an ephemeral fleet.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Every job carries the same guard: pull requests from forks never run on the
# self-hosted runners, because the persistent Docker daemon and the host
# caches would be reachable from untrusted code.
jobs:
  policy:
    name: policy
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Repository policy checks
        env:
          # Empty outside pull requests, which skips the diff-based checks.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          .github/scripts/ci-run.sh --no-install -e BASE_SHA -e HEAD_SHA -- '
            pnpm check:node-version
            node ./scripts/check-docker-deps-stage.mjs
            node ./scripts/check-no-git-push.mjs
            node --test ./scripts/check-no-git-push.test.mjs
            pnpm check:module-boundaries
            node --test ./scripts/check-module-boundaries.test.mjs
            node --test ".github/scripts/tests/*.test.mjs"
            node --test ./scripts/__tests__/run-vitest-stable-shard.test.mjs
            node --test ./scripts/__tests__/e2e-shard.test.mjs
            node --test ./scripts/__tests__/release-verify-workflow.test.mjs ./scripts/cloud-source-verification.test.mjs ./scripts/standard-image-contract.test.mjs
            node --test ./scripts/__tests__/build-standalone-concurrency.test.mjs
            node ./scripts/release-package-map.mjs check
            if [ -n "${BASE_SHA:-}" ]; then
              node .github/scripts/check-pr-migration-order.mjs "$BASE_SHA"
              mapfile -t changed_paths < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
              PAPERCLIP_RELEASE_BOOTSTRAP_BASE_SHA="$BASE_SHA" \
                node ./scripts/check-release-package-bootstrap.mjs "${changed_paths[@]}"
            fi
            pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
          '

  # Lanes share one definition: install, then one command. They queue on
  # whatever runners exist and run in parallel when there is more than one.
  # The shard counts are smaller than upstream's ephemeral-fleet counts, since
  # every extra shard here repeats checkout and install on a persistent host.
  check:
    name: ${{ matrix.name }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: typecheck + release registry
            command: pnpm run typecheck:build-gaps && pnpm run test:release-registry
          - name: build
            command: pnpm --filter @paperclipai/paperclip-runner build:issue-thread && pnpm build
          - name: server (1/4)
            command: pnpm test:run:general -- --group general-server-without-chat --shard-index 0 --shard-count 4
          - name: server (2/4)
            command: pnpm test:run:general -- --group general-server-without-chat --shard-index 1 --shard-count 4
          - name: server (3/4)
            command: pnpm test:run:general -- --group general-server-without-chat --shard-index 2 --shard-count 4
          - name: server (4/4)
            command: pnpm test:run:general -- --group general-server-without-chat --shard-index 3 --shard-count 4
          - name: chat
            command: pnpm test:run:general -- --group general-chat
          - name: workspaces-a
            command: pnpm test:run:general -- --group general-workspaces-a
          - name: workspaces-b
            command: pnpm test:run:general -- --group general-workspaces-b
          - name: serialized server (1/3)
            command: pnpm test:run:serialized -- --shard-index 0 --shard-count 3
          - name: serialized server (2/3)
            command: pnpm test:run:serialized -- --shard-index 1 --shard-count 3
          - name: serialized server (3/3)
            command: pnpm test:run:serialized -- --shard-index 2 --shard-count 3
          - name: runner static checks
            command: pnpm --filter @paperclipai/paperclip-runner check:static
          - name: runner rust
            command: pnpm --filter @paperclipai/paperclip-runner check:runner
          - name: runner vitest
            command: pnpm --filter @paperclipai/paperclip-runner test:typescript:vitest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: ${{ matrix.name }}
        env:
          CI_COMMAND: ${{ matrix.command }}
        run: .github/scripts/ci-run.sh -- "$CI_COMMAND"

  docker:
    name: docker
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    env:
      CONTEXT_IMAGE: paperclip-context-checks:${{ github.run_id }}-${{ github.run_attempt }}
      PRODUCTION_IMAGE: paperclip-production:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Same .dockerignore semantics as the real image build: a change that
      # strips a committed build input from the context fails here instead of
      # in the image build.
      - name: Docker context integrity
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --file .github/docker-context-checks.Dockerfile \
            --tag "$CONTEXT_IMAGE" .

      # The full production image (UI, server, Runner binary) is the slowest
      # lane, so pull requests skip it. Plain `docker build` reuses layers in
      # the persistent daemon's local cache; nothing is pushed.
      - name: Build production image
        if: github.event_name != 'pull_request'
        run: |
          # The Dockerfile installs with --frozen-lockfile; refresh a stale
          # lockfile first, as the upstream image workflow does.
          .github/scripts/ci-run.sh --no-install -- 'pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile'
          DOCKER_BUILDKIT=1 docker build \
            --target production \
            --build-arg "PAPERCLIP_BUILD_COMMIT=$GITHUB_SHA" \
            --tag "$PRODUCTION_IMAGE" .

      - name: Verify PID 1 reaps orphaned processes
        if: github.event_name != 'pull_request'
        run: docker run --rm -i "$PRODUCTION_IMAGE" sh -s < scripts/assert-orphan-reaping.sh

      - name: Remove CI images
        if: always()
        run: docker image rm "$CONTEXT_IMAGE" "$PRODUCTION_IMAGE" || true

  # Single required-check name that stays stable as lanes are added or split.
  verify:
    name: verify
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [policy, check, docker]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Fail if any lane failed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if printf '%s' "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            exit 1
          fi
